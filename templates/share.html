<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ person.name }} · Kang G. Shin Academic Family Tree</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ description }}">
  <meta property="og:type" content="profile">
  <meta property="og:site_name" content="Kang G. Shin · Academic Family Tree">
  <meta property="og:title" content="{{ person.name }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:url" content="{{ site_url }}p/{{ person.id }}.html">
  {% if image %}
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  {% endif %}
  <link rel="canonical" href="{{ site_url }}index.html?id={{ person.id }}">
  <meta http-equiv="refresh" content="0; url=../index.html?id={{ person.id }}">
  <script>location.replace("../index.html?id={{ person.id }}");</script>
</head>
<body>
  <p><a href="../index.html?id={{ person.id }}">{{ person.name }} in the Kang G. Shin academic family tree</a></p>
</body>
</html>
