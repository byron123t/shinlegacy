{% extends "base.html" %}
{% block content %}
<section class="panel narrow">
  <h1>Login</h1>
  <form method="post" action="{{ url_for('login_post') }}" class="form">
    <label>
      Password
      <input type="password" name="password" required placeholder="Enter password">
    </label>
    <button type="submit">Log in</button>
  </form>
</section>
{% endblock %}
